<app-sidebar
  [isOpen]="isSidebarOpen()"
  (toggleRequested)="toggleSidebar()"
  (closeRequested)="closeSidebar()"
></app-sidebar>

<main class="tavern-page relative min-h-screen">
  <div class="page-frame lg:ml-72 transition-all duration-300">
    <section class="welcome" aria-labelledby="welcome-title">
      <div class="welcome-copy">
        <p class="eyebrow">
          <span class="eyebrow-line" aria-hidden="true"></span
          ><span i18n>Miejsce dla ludzi szlaku</span>
        </p>
        <h1 id="welcome-title" i18n>Tawerna <span class="title-accent">MTB</span></h1>
        <p class="welcome-text" i18n>
          Najpierw ścieżka pod kołami. Potem ciepłe światło, wspólny stół i historie z trasy.
        </p>
        <div class="welcome-rule" aria-hidden="true">
          <span></span><span class="rule-star">✦</span><span></span>
        </div>
        <p class="welcome-signoff" i18n>
          Tu kończy się zjazd.<br />Dobra opowieść dopiero się zaczyna.
        </p>
      </div>

      <div class="crest-wrap">
        <svg class="tavern-crest" viewBox="0 0 400 400" role="img" aria-labelledby="crest-title">
          <title id="crest-title" i18n>Emblemat Tawerny MTB z górskim szlakiem i rowerem</title>
          <circle class="crest-ring crest-ring-outer" cx="200" cy="200" r="184" />
          <circle class="crest-ring crest-ring-inner" cx="200" cy="200" r="172" />
          <path class="crest-roof" d="M125 132 200 78l75 54H125Z" />
          <path class="crest-mountain" d="m103 178 50-62 30 37 22-27 65 68" />
          <path class="crest-mountain-detail" d="m144 127 9-11 13 16m42-6 7-8 16 18" />
          <circle class="crest-wheel" cx="116" cy="238" r="48" />
          <circle class="crest-wheel" cx="284" cy="238" r="48" />
          <path
            class="crest-bike"
            d="m116 238 52-61 44 61h-96l52-61 35 3 81 58-72-2-28-59m-28 0-10-15m61 16 13-2 15 2"
          />
          <path class="crest-ground" d="M82 307h236" />
          <text class="crest-inscription" x="200" y="334" text-anchor="middle" i18n>
            Szlaki · ludzie · ognisko
          </text>
          <path class="crest-star" d="m200 51 3 7 7 3-7 3-3 7-3-7-7-3 7-3 3-7Z" />
        </svg>
        <span class="crest-caption" i18n>Dobrze być na swoim szlaku</span>
      </div>
    </section>

    <footer class="trail-footer">
      <span i18n>Trasy, które chce się pamiętać.</span>
      <span class="footer-mark"
        ><i aria-hidden="true"></i><span i18n>Zjazd · Ognisko · Powtórka</span></span
      >
    </footer>
  </div>

  @if (isSidebarOpen()) {
    <div
      (click)="closeSidebar()"
      class="fixed inset-0 z-30 bg-black/50 backdrop-blur-md lg:hidden transition-opacity duration-300 cursor-pointer"
    ></div>
  }
</main>
