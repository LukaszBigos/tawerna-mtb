<button
  type="button"
  class="mt-3 flex w-full cursor-pointer items-center justify-between rounded-lg border border-[#b8c6b5] bg-[#e1e9de] px-3 py-2 text-sm font-medium text-[#304338]"
  [attr.aria-expanded]="open()"
  (click)="toggle.emit()"
>
  <span class="flex items-center gap-2">
    {{ 'dashboard.filters' | translate }}
    @if (selectedCount() > 0) {
      <span class="rounded-full bg-[#c8d7c5] px-1.5 py-0.5 text-[10px] text-[#344b38]">
        {{ selectedCount() }}
      </span>
    }
  </span>
  <span
    aria-hidden="true"
    class="leading-none transition-transform"
    [class.rotate-180]="open()"
    >⌄</span
  >
</button>
