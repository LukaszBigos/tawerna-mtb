<section class="mt-3">
  <h3 class="mb-2 text-[11px] font-semibold uppercase tracking-wider text-[#68786a]">
    {{ 'dashboard.difficulty' | translate }}
  </h3>
  <div class="flex flex-wrap gap-1.5">
    @for (difficulty of difficulties; track difficulty) {
      <button
        type="button"
        class="cursor-pointer rounded-md border px-2.5 py-1.5 text-xs transition focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#c9784b]"
        [ngClass]="
          selectedDifficulties().includes(difficulty)
            ? 'border-[#789174] bg-[#c8d7c5] text-[#344b38]'
            : 'border-[#b8c6b5] bg-[#e1e9de] text-[#657568] hover:border-[#c9784b] hover:bg-[#e4e3d9] hover:text-[#304338]'
        "
        [attr.aria-pressed]="selectedDifficulties().includes(difficulty)"
        (click)="difficultyToggled.emit(difficulty)"
      >
        {{ 'difficulty.' + difficulty | translate }}
      </button>
    }
  </div>
</section>
